
<!DOCTYPE html>
<html lang="zh-Hant">

{% load static %}

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>探劇實錄｜劇本詳細</title>

    <link rel="stylesheet" href="{% static 'scripts/style.css' %}">

</head>


<body>

    <!-- 左側選單 -->
    <aside class="sidebar">

        <h2>探劇實錄</h2>

        <nav>

            <a href="{% url 'script-list' %}">📚 劇本列表</a>

            <a href="#">🏆 榜單與推薦</a>

            <a href="#">❤️ 我的收藏</a>

            <a href="#">👤 會員登入</a>

        </nav>

    </aside>


    <!-- 右側主要內容 -->
    <div class="page-content">

        <header>

            <h1>劇本詳細</h1>

        </header>


        <main>

            <!-- 劇本詳細資訊 -->
            <section class="script-detail">

                <!-- 劇本圖片 -->
                <div class="detail-image">

                    <img src="{{ script.image_url }}" alt="{{ script.script_name }}">

                </div>


                <!-- 劇本資訊 -->
                <div class="detail-info">

                    <h2>{{ script.script_name }}</h2>

                    <p class="rating">⭐ {{ script.rating }}</p>

                    <p>🕵️ 分類：{{ script.script_type }}</p>

                    <p>👥 人數：{{ script.players_count }}</p>

                    <p>⏱ 遊玩時間：{{ script.play_time }}</p>

                    <button class="favorite-btn">♡ 收藏</button>

                </div>

            </section>


            <!-- 劇本介紹 -->
            <section class="script-description">

                <h2>劇本介紹</h2>

                <p>
                    {{ script.description }}
                </p>

            </section>


            <a href="{% url 'script-list' %}" class="back-button">
                ← 回到劇本列表
            </a>

        </main>

    </div>


<script>

const favoriteButtons = document.querySelectorAll(".favorite-btn");

favoriteButtons.forEach(function(button) {
    button.addEventListener("click", function(event) {

        event.preventDefault();
        event.stopPropagation();

        if (button.classList.contains("active")) {
            button.classList.remove("active");
            button.textContent = "♡ 收藏";
        } else {
            button.classList.add("active");
            button.textContent = "♥ 已收藏";
        }

    });
});

</script>

</body>

</html>
