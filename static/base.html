<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探劇實錄</title>
    
    <!-- 引入外部 CSS 樣式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 行動裝置頂部 Header (<992px 時顯示) -->
    <div class="mobile-header">
        <h1><span>🔍</span> 探劇實錄</h1>
        <button class="menu-toggle" id="menuToggle">☰</button>
    </div>

    <!-- 側邊欄 -->
    <aside class="sidebar" id="sidebar">
        <h2>📌 主選單</h2>
        <nav>
            <a href="firstpage.html">🏠 首頁</a>
            <a href="script-list.html">📜 劇本列表</a>
            <a href="recommend.html">🏆 榜單與推薦</a>
            <a href="login.html">👤 會員登入 / 我的收藏</a>
        </nav>

        <h2>🎭 依風格快速找</h2>
        <nav>
            <a href="#">🔍 推理</a>
            <a href="#">🎭 情感</a>
            <a href="#">👻 恐怖</a>
            <a href="#">🥳 歡樂</a>
            <a href="#">⚔️ 陣營</a>
            <a href="#">⚙️ 機制</a>
        </nav>

        <div class="sidebar-music" style="margin-top: 15px;">
            <h2>🎵 背景氛圍</h2>
            <!-- 💡 補上了 id="bgm" 方便 JavaScript 控制 -->
            <audio id="bgm" src="music/Broken%20Music%20Box.mp3" controls autoplay loop style="width: 100%; height: 35px;"></audio>
        </div>
    </aside>

    <!-- 主內容區 -->
    <div class="main-wrapper">
        <header class="site-header">
            <h1><span class="logo-icon">🔍</span> 探劇實錄</h1>
        </header>

        <main class="page-content">
            <!-- 內容放這裡 -->
        </main>

        <!-- 💡 補上滿版 Google 風格頁尾 (放在 main-wrapper 內部最下方) -->
        <footer class="site-footer">
            <div class="footer-top">
                <span>2026探劇實錄</span>
            </div>
        </footer>
    </div>

    <!-- 💡 合併整理後的單一 JavaScript 區塊 -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            /* =========================
            手機選單
            ========================= */

            const menuToggle = document.getElementById("menuToggle");
            const sidebar = document.getElementById("sidebar");

            if (menuToggle && sidebar) {
                menuToggle.addEventListener("click", function () {
                    sidebar.classList.toggle("show");
                });
            }


            /* =========================
            背景音樂
            ========================= */

            const audio = document.getElementById("bgm");

            if (audio) {
                audio.play().catch(function () {

                    const startAudio = function () {
                        audio.play();

                        document.removeEventListener(
                            "click",
                            startAudio
                        );
                    };

                    document.addEventListener(
                        "click",
                        startAudio
                    );
                });
            }


            /* =========================
            🩸 滑鼠血流效果
            ========================= */

            let lastX = 0;
            let lastY = 0;

            document.addEventListener("mousemove", function (event) {

                const x = event.clientX;
                const y = event.clientY;

                /* 計算滑鼠移動距離 */
                const distance = Math.sqrt(
                    Math.pow(x - lastX, 2) +
                    Math.pow(y - lastY, 2)
                );

                /* 移動太小就不產生血滴 */
                if (distance < 8) {
                    return;
                }

                lastX = x;
                lastY = y;


                /* 建立血滴 */
                const blood = document.createElement("div");

                blood.className = "mouse-blood";

                /* 血滴位置 */
                blood.style.left = x + "px";
                blood.style.top = y + "px";


                /* 隨機大小 */
                const size = Math.random() * 10 + 6;

                blood.style.width = size + "px";
                blood.style.height = size + "px";


                /* 隨機偏移 */
                const offsetX = (Math.random() - 0.5) * 20;
                const offsetY = (Math.random() - 0.5) * 20;

                blood.style.setProperty(
                    "--blood-x",
                    offsetX + "px"
                );

                blood.style.setProperty(
                    "--blood-y",
                    offsetY + "px"
                );


                /* 加到網頁 */
                document.body.appendChild(blood);


                /* 動畫結束後刪除 */
                setTimeout(function () {

                    blood.remove();

                }, 900);

            });

        });
    </script>
</body>
</html>
