<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>探劇實錄</title>
    
    <!-- 引入外部 CSS 樣式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 行動裝置頂部 Header (<992px 時顯示) -->
    <div class="mobile-header">
        <h1><span>🔍</span> 探劇實錄</h1>
        <button class="menu-toggle" id="menuToggle">☰</button>
    </div>

    <!-- 側邊欄 -->
    <aside class="sidebar" id="sidebar">
        <h2>📌 主選單</h2>
        <nav>
            <a href="firstpage.html">🏠 首頁</a>
            <a href="script-list.html">📜 劇本列表</a>
            <a href="recommend.html">🏆 榜單與推薦</a>
            <a href="login.html">👤 會員登入 / 我的收藏</a>
        </nav>

        <h2>🎭 依風格快速找</h2>
        <nav>
            <a href="#">🔍 推理</a>
            <a href="#">🎭 情感</a>
            <a href="#">👻 恐怖</a>
            <a href="#">🥳 歡樂</a>
            <a href="#">⚔️ 陣營</a>
            <a href="#">⚙️ 機制</a>
        </nav>

        <div class="sidebar-music" style="margin-top: 15px;">
            <h2>🎵 背景氛圍</h2>
            <!-- 💡 補上了 id="bgm" 方便 JavaScript 控制 -->
            <audio id="bgm" src="Broken%20Music%20Box.mp3" controls autoplay loop style="width: 100%; height: 35px;"></audio>
        </div>
    </aside>

    <!-- 主內容區 -->
    <div class="main-wrapper">
        <header class="site-header">
            <h1><span class="logo-icon">🔍</span> 探劇實錄</h1>
        </header>

        <main class="page-content">
            <!-- 內容放這裡 -->
        </main>

        <!-- 💡 補上滿版 Google 風格頁尾 (放在 main-wrapper 內部最下方) -->
        <footer class="site-footer">
            <div class="footer-top">
                <span>2026探劇實錄</span>
            </div>
        </footer>
    </div>

    <!-- 💡 合併整理後的單一 JavaScript 區塊 -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // 1. 手機版選單切換邏輯
            const menuToggle = document.getElementById("menuToggle");
            const sidebar = document.getElementById("sidebar");

            if (menuToggle && sidebar) {
                menuToggle.addEventListener("click", function () {
                    sidebar.classList.toggle("show");
                });
            }

            // 2. 解鎖瀏覽器背景音樂自動播放限制
            const audio = document.getElementById("bgm");
            
            if (audio) {
                // 嘗試自動播放
                audio.play().catch(function () {
                    // 若被 Chrome/Edge 阻擋，等使用者第一次點擊網頁時立即觸發播放
                    const startAudio = function () {
                        audio.play();
                        document.removeEventListener("click", startAudio); // 成功播放後解除監聽
                    };
                    document.addEventListener("click", startAudio);
                });
            }
        });
    </script>
</body>
</html>
