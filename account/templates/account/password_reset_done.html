<!doctype html>

<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>重設密碼｜探劇實錄</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background-color: #030338;

        color: #e4e2de;

        font-family: "Segoe UI", Arial, "Microsoft JhengHei", sans-serif;

        padding: 20px;
      }

      .reset-container {
        width: 100%;
        max-width: 420px;

        padding: 45px 40px;

        background-color: #16161d;

        border: 1px solid #2a2a35;

        border-radius: 10px;

        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);

        text-align: center;
      }

      .logo {
        margin-bottom: 35px;
      }

      .logo h1 {
        color: #ff2a2a;

        font-size: 32px;

        font-weight: 800;

        letter-spacing: 4px;

        text-shadow: 0 0 12px rgba(255, 42, 42, 0.4);
      }

      .logo p {
        margin-top: 10px;

        color: #888899;

        font-size: 14px;
      }

      .reset-title {
        margin-bottom: 20px;
      }

      .reset-title h2 {
        color: #ffffff;

        font-size: 22px;

        font-weight: 600;
      }

      .reset-message {
        margin-bottom: 25px;

        color: #aaaaaa;

        font-size: 14px;

        line-height: 1.8;
      }

      .bottom-links {
        margin-top: 25px;

        font-size: 14px;
      }

      .bottom-links a {
        color: #ff2a2a;

        text-decoration: none;
      }

      .bottom-links a:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        body {
          padding: 15px;
        }

        .reset-container {
          padding: 35px 25px;
          border-radius: 8px;
        }

        .logo {
          margin-bottom: 30px;
        }

        .logo h1 {
          font-size: 28px;
          letter-spacing: 3px;
        }

        .logo p {
          font-size: 13px;
        }

        .reset-title h2 {
          font-size: 20px;
        }
      }

      @media (max-width: 360px) {
        body {
          padding: 10px;
        }

        .reset-container {
          padding: 30px 20px;
        }

        .logo h1 {
          font-size: 25px;
          letter-spacing: 2px;
        }
      }
    </style>
  </head>

  <body>
    <div class="reset-container">
      <div class="logo">
        <h1>探劇實錄</h1>

        <p>劇本殺資訊與交流平台</p>
      </div>

      <div class="reset-title">
        <h2>重設密碼</h2>
      </div>

      <p class="reset-message">
        如果您輸入的 Email 已經註冊， 我們會寄送密碼重設連結給您。
        <br />
        請前往 Email 查收信件。
      </p>

      <div class="bottom-links">
        <a href="{% url 'account' %}"> 返回登入 </a>
      </div>
    </div>
  </body>
</html>
