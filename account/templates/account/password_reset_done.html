{% extends "base.html" %}
{% load static %}

{% block title %}重設密碼｜探劇實錄{% endblock %}


{% block extra_css %}
<link rel="stylesheet" href="{% static 'account/account.css' %}">
{% endblock %}


{% block content %}

<div class="account-reset-done-page">

    <div class="reset-done-container">

        <div class="reset-done-title">

            <h2>重設密碼</h2>

        </div>


        <p class="reset-done-message">

            如果您輸入的 Email 已經註冊，<br>
            我們會寄送密碼重設連結給您。

            <br><br>

            請前往 Email 查收信件。

        </p>


        <div class="reset-done-links">

            <a href="{% url 'account' %}">
                返回登入
            </a>

        </div>

    </div>

</div>

{% endblock %}
