{% extends "base.html" %}

{% block title %}重設密碼｜探劇實錄{% endblock %}


{% block extra_css %}

<style>

    /* =========================
       密碼重設信已寄出頁面
       ========================= */

    .account-reset-done-page {
        width: 100%;
        min-height: 520px;

        display: flex;
        justify-content: center;
        align-items: center;
    }


    /* =========================
       提示卡片
       ========================= */

    .reset-done-container {
        width: 100%;
        max-width: 420px;

        padding: 40px;

        background-color: #120f38;

        border: 1px solid #2d3154;
        border-radius: 10px;

        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);

        text-align: center;
    }


    /* =========================
       標題
       ========================= */

    .reset-done-title {
        margin-bottom: 20px;
    }

    .reset-done-title h2 {
        color: #ff2a2a;

        font-size: 24px;
        font-weight: 700;
    }


    /* =========================
       提示訊息
       ========================= */

    .reset-done-message {
        margin-bottom: 25px;

        color: #b1b5c8;

        font-size: 14px;
        line-height: 1.8;
    }


    /* =========================
       返回登入
       ========================= */

    .reset-done-links {
        margin-top: 25px;

        font-size: 14px;
    }

    .reset-done-links a {
        color: #ff2a2a;

        text-decoration: none;
    }

    .reset-done-links a:hover {
        color: #ffffff;

        text-decoration: underline;
    }


    /* =========================
       手機版
       ========================= */

    @media (max-width: 480px) {

        .account-reset-done-page {
            min-height: auto;

            padding: 10px 0;
        }

        .reset-done-container {
            padding: 30px 22px;
        }

        .reset-done-title h2 {
            font-size: 22px;
        }

    }

</style>

{% endblock %}


{% block content %}

<div class="account-reset-done-page">

    <div class="reset-done-container">

        <div class="reset-done-title">

            <h2>重設密碼</h2>

        </div>


        <p class="reset-done-message">

            如果您輸入的 Email 已經註冊，<br>
            我們會寄送密碼重設連結給您。

            <br><br>

            請前往 Email 查收信件。

        </p>


        <div class="reset-done-links">

            <a href="{% url 'account' %}">
                返回登入
            </a>

        </div>

    </div>

</div>

{% endblock %}
