<!DOCTYPE html>

<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>忘記密碼｜探劇實錄</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        background-color: #030338;

        color: #e4e2de;

        font-family: "Segoe UI",
                     Arial,
                     "Microsoft JhengHei",
                     sans-serif;

        padding: 20px;
    }


    .reset-container {

        width: 100%;
        max-width: 420px;

        padding: 45px 40px;

        background-color: #16161D;

        border: 1px solid #2A2A35;

        border-radius: 10px;

        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }


    .logo {

        text-align: center;

        margin-bottom: 35px;
    }


    .logo h1 {

        color: #FF2A2A;

        font-size: 32px;

        font-weight: 800;

        letter-spacing: 4px;

        text-shadow:
            0 0 12px rgba(255, 42, 42, 0.4);
    }


    .logo p {

        margin-top: 10px;

        color: #888899;

        font-size: 14px;
    }


    .reset-title {

        margin-bottom: 25px;
    }


    .reset-title h2 {

        color: #FFFFFF;

        font-size: 22px;

        font-weight: 600;
    }


    .reset-description {

        margin-bottom: 20px;

        color: #AAAAAA;

        font-size: 14px;

        line-height: 1.6;
    }


    .form-group {

        margin-bottom: 20px;
    }


    .form-group label {

        display: block;

        margin-bottom: 8px;

        color: #AAAAAA;

        font-size: 14px;
    }


    .form-group input {

        width: 100%;

        padding: 13px 14px;

        background-color: #0F0F18;

        border: 1px solid #333344;

        border-radius: 6px;

        color: #FFFFFF;

        font-size: 15px;

        outline: none;

        transition: 0.2s;
    }


    .form-group input::placeholder {

        color: #666677;
    }


    .form-group input:focus {

        border-color: #FF2A2A;

        box-shadow:
            0 0 8px rgba(255, 42, 42, 0.3);
    }


    .reset-button {

        width: 100%;

        padding: 13px;

        margin-top: 5px;

        border: 1px solid #FF2A2A;

        border-radius: 6px;

        background-color: #FF2A2A;

        color: #FFFFFF;

        font-size: 16px;

        font-weight: 600;

        cursor: pointer;

        transition: 0.2s;
    }


    .reset-button:hover {

        background-color: #d91f1f;

        box-shadow:
            0 0 10px rgba(255, 42, 42, 0.4);
    }


    .bottom-links {

        margin-top: 25px;

        text-align: center;

        color: #777788;

        font-size: 14px;
    }


    .bottom-links a {

        color: #FF2A2A;

        text-decoration: none;
    }


    .bottom-links a:hover {

        text-decoration: underline;
    }


    @media (max-width: 480px) {

        body {
            padding: 15px;
        }

        .reset-container {
            padding: 35px 25px;
            border-radius: 8px;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            letter-spacing: 3px;
        }

        .logo p {
            font-size: 13px;
        }

        .reset-title h2 {
            font-size: 20px;
        }

    }


    @media (max-width: 360px) {

        body {
            padding: 10px;
        }

        .reset-container {
            padding: 30px 20px;
        }

        .logo h1 {
            font-size: 25px;
            letter-spacing: 2px;
        }

    }

</style>

</head>

<body>

<div class="reset-container">

    <div class="logo">

        <h1>探劇實錄</h1>

        <p>劇本殺資訊與交流平台</p>

    </div>


    <div class="reset-title">

        <h2>忘記密碼</h2>

    </div>


    <p class="reset-description">
        請輸入您註冊時使用的 Email，我們會寄送密碼重設連結給您。
    </p>


    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="id_email">
                Email
            </label>

            <input
                type="email"
                id="id_email"
                name="email"
                placeholder="請輸入 Email"
                required
            >

        </div>


        <button
            type="submit"
            class="reset-button"
        >
            寄送重設信
        </button>

    </form>


    <div class="bottom-links">

        <a href="{% url 'account' %}">
            返回登入
        </a>

    </div>

</div>

</body>

</html>
