{% extends "base.html" %}

{% block title %}忘記密碼｜探劇實錄{% endblock %}


{% block extra_css %}

<style>

    /* =========================
       忘記密碼頁面
       ========================= */

    .account-reset-page {
        width: 100%;
        min-height: 520px;

        display: flex;
        justify-content: center;
        align-items: center;
    }


    /* =========================
       重設密碼卡片
       ========================= */

    .reset-container {
        width: 100%;
        max-width: 420px;

        padding: 40px;

        background-color: #120f38;

        border: 1px solid #2d3154;
        border-radius: 10px;

        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }


    /* =========================
       標題
       ========================= */

    .reset-title {
        margin-bottom: 20px;
        text-align: center;
    }

    .reset-title h2 {
        color: #ff2a2a;

        font-size: 24px;
        font-weight: 700;
    }


    /* =========================
       說明文字
       ========================= */

    .reset-description {
        margin-bottom: 22px;

        color: #b1b5c8;

        font-size: 14px;
        line-height: 1.7;

        text-align: center;
    }


    /* =========================
       表單
       ========================= */

    .reset-form-group {
        margin-bottom: 20px;
    }

    .reset-form-group label {
        display: block;

        margin-bottom: 8px;

        color: #b1b5c8;

        font-size: 14px;
    }

    .reset-form-group input {
        width: 100%;

        padding: 13px 14px;

        background-color: #26273b;

        border: 1px solid #3b3f66;
        border-radius: 6px;

        color: #ffffff;

        font-size: 15px;

        outline: none;

        transition: 0.2s;
    }

    .reset-form-group input::placeholder {
        color: #777b91;
    }

    .reset-form-group input:focus {
        border-color: #ff2a2a;

        box-shadow: 0 0 8px rgba(255, 42, 42, 0.25);
    }


    /* =========================
       按鈕
       ========================= */

    .reset-button {
        width: 100%;

        padding: 13px;

        margin-top: 5px;

        border: none;
        border-radius: 6px;

        background-color: #ff2a2a;

        color: #ffffff;

        font-size: 16px;
        font-weight: 600;

        cursor: pointer;

        transition: 0.2s;
    }

    .reset-button:hover {
        background-color: #e50000;

        box-shadow: 0 0 10px rgba(255, 42, 42, 0.35);
    }


    /* =========================
       返回登入
       ========================= */

    .reset-bottom-links {
        margin-top: 25px;

        text-align: center;

        font-size: 14px;
    }

    .reset-bottom-links a {
        color: #ff2a2a;

        text-decoration: none;
    }

    .reset-bottom-links a:hover {
        color: #ffffff;

        text-decoration: underline;
    }


    /* =========================
       手機版
       ========================= */

    @media (max-width: 480px) {

        .account-reset-page {
            min-height: auto;

            padding: 10px 0;
        }

        .reset-container {
            padding: 30px 22px;
        }

        .reset-title h2 {
            font-size: 22px;
        }
    }

</style>

{% endblock %}


{% block content %}

<div class="account-reset-page">

    <div class="reset-container">

        <div class="reset-title">
            <h2>忘記密碼</h2>
        </div>


        <p class="reset-description">
            請輸入您註冊時使用的 Email，我們會寄送密碼重設連結給您。
        </p>


        <form method="POST">

            {% csrf_token %}


            <div class="reset-form-group">

                <label for="id_email">
                    Email
                </label>

                <input
                    type="email"
                    id="id_email"
                    name="email"
                    placeholder="請輸入 Email"
                    required
                >

            </div>


            <button
                type="submit"
                class="reset-button"
            >
                寄送重設信
            </button>

        </form>


        <div class="reset-bottom-links">

            <a href="{% url 'account' %}">
                返回登入
            </a>

        </div>

    </div>

</div>

{% endblock %}
