{% extends "base.html" %}
{% load static %}

{% block title %}忘記密碼｜探劇實錄{% endblock %}


{% block extra_css %}
<link rel="stylesheet" href="{% static 'account/account.css' %}">
{% endblock %}


{% block content %}

<div class="account-reset-page">

    <div class="reset-container">

        <div class="reset-title">
            <h2>忘記密碼</h2>
        </div>


        <p class="reset-description">
            請輸入您註冊時使用的 Email，我們會寄送密碼重設連結給您。
        </p>


        <form method="POST">

            {% csrf_token %}


            <div class="reset-form-group">

                <label for="id_email">
                    Email
                </label>

                <input
                    type="email"
                    id="id_email"
                    name="email"
                    placeholder="請輸入 Email"
                    required
                >

            </div>


            <button
                type="submit"
                class="reset-button"
            >
                寄送重設信
            </button>

        </form>


        <div class="reset-bottom-links">

            <a href="{% url 'account' %}">
                返回登入
            </a>

        </div>

    </div>

</div>

{% endblock %}
