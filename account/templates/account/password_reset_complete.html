<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密碼重設完成｜探劇實錄</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f1020;
            color: #ffffff;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #181a30;
            border: 1px solid #2d3154;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            color: #ffffff;
        }

        h2 {
            margin: 0 0 25px;
            color: #ff4d5a;
        }

        p {
            margin: 0 0 25px;
            line-height: 1.7;
            color: #d8d9e8;
        }

        .login-button {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            background: #ff4d5a;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
        }

        .login-button:hover {
            background: #e63f4c;
        }

        @media (max-width: 480px) {
            .container {
                margin: 20px;
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>探劇實錄</h1>

    <h2>密碼重設完成</h2>

    <p>
        您的密碼已經成功更新。<br>
        現在可以使用新密碼登入網站。
    </p>

    <a href="{% url 'account' %}" class="login-button">
        返回登入
    </a>

</div>

</body>
</html>
