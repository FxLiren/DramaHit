{% extends "base.html" %}

{% block title %}密碼重設完成｜探劇實錄{% endblock %}


{% block extra_css %}

<style>

    /* =========================
       密碼重設完成頁面
       ========================= */

    .account-reset-complete-page {
        width: 100%;
        min-height: 520px;

        display: flex;
        justify-content: center;
        align-items: center;
    }


    /* =========================
       完成提示卡片
       ========================= */

    .reset-complete-container {
        width: 100%;
        max-width: 420px;

        padding: 40px;

        background-color: #120f38;

        border: 1px solid #2d3154;
        border-radius: 10px;

        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);

        text-align: center;
    }


    /* =========================
       標題
       ========================= */

    .reset-complete-title {
        margin-bottom: 20px;
    }

    .reset-complete-title h2 {
        margin: 0;

        color: #ff2a2a;

        font-size: 24px;
        font-weight: 700;
    }


    /* =========================
       完成訊息
       ========================= */

    .reset-complete-message {
        margin: 0 0 25px;

        color: #b1b5c8;

        font-size: 14px;
        line-height: 1.8;
    }


    /* =========================
       返回登入按鈕
       ========================= */

    .reset-complete-login-button {
        display: block;

        width: 100%;

        padding: 13px;

        border-radius: 6px;

        background-color: #ff2a2a;

        color: #ffffff;

        text-decoration: none;

        font-size: 16px;
        font-weight: 600;

        transition: 0.2s;
    }

    .reset-complete-login-button:hover {
        background-color: #e50000;

        color: #ffffff;

        box-shadow: 0 0 10px rgba(255, 42, 42, 0.35);
    }


    /* =========================
       手機版
       ========================= */

    @media (max-width: 480px) {

        .account-reset-complete-page {
            min-height: auto;

            padding: 10px 0;
        }

        .reset-complete-container {
            padding: 30px 22px;
        }

        .reset-complete-title h2 {
            font-size: 22px;
        }

    }

</style>

{% endblock %}


{% block content %}

<div class="account-reset-complete-page">

    <div class="reset-complete-container">

        <div class="reset-complete-title">

            <h2>密碼重設完成</h2>

        </div>


        <p class="reset-complete-message">

            您的密碼已經成功更新。<br>
            現在可以使用新密碼登入網站。

        </p>


        <a
            href="{% url 'account' %}"
            class="reset-complete-login-button"
        >
            返回登入
        </a>

    </div>

</div>

{% endblock %}
