{% extends "base.html" %}

{% block title %}會員登入｜探劇實錄{% endblock %}


{% block extra_css %}

<style>

    /* =========================
       會員登入頁面
       ========================= */

    .account-login-page {
        width: 100%;
        min-height: 520px;

        display: flex;
        justify-content: center;
        align-items: center;
    }


    /* =========================
       登入卡片
       ========================= */

    .login-container {
        width: 100%;
        max-width: 420px;

        padding: 40px;

        background-color: #120f38;

        border: 1px solid #2d3154;
        border-radius: 10px;

        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }


    /* =========================
       登入標題
       ========================= */

    .login-title {
        margin-bottom: 28px;
        text-align: center;
    }

    .login-title h2 {
        color: #ff2a2a;

        font-size: 24px;
        font-weight: 700;
    }

    .login-title p {
        margin-top: 8px;

        color: #b1b5c8;

        font-size: 14px;
    }


    /* =========================
       表單
       ========================= */

    .login-form-group {
        margin-bottom: 20px;
    }

    .login-form-group label {
        display: block;

        margin-bottom: 8px;

        color: #b1b5c8;

        font-size: 14px;
    }

    .login-form-group input {
        width: 100%;

        padding: 13px 14px;

        background-color: #26273b;

        border: 1px solid #3b3f66;
        border-radius: 6px;

        color: #ffffff;

        font-size: 15px;

        outline: none;

        transition: 0.2s;
    }

    .login-form-group input::placeholder {
        color: #777b91;
    }

    .login-form-group input:focus {
        border-color: #ff2a2a;

        box-shadow: 0 0 8px rgba(255, 42, 42, 0.25);
    }


    /* =========================
       忘記密碼
       ========================= */

    .forgot-password {
        margin-top: -8px;
        margin-bottom: 20px;

        text-align: right;

        font-size: 14px;
    }

    .forgot-password a {
        color: #b1b5c8;

        text-decoration: none;
    }

    .forgot-password a:hover {
        color: #ffffff;

        text-decoration: underline;
    }


    /* =========================
       登入按鈕
       ========================= */

    .login-button {
        width: 100%;

        padding: 13px;

        border: none;
        border-radius: 6px;

        background-color: #ff2a2a;

        color: #ffffff;

        font-size: 16px;
        font-weight: 600;

        cursor: pointer;

        transition: 0.2s;
    }

    .login-button:hover {
        background-color: #e50000;

        box-shadow: 0 0 10px rgba(255, 42, 42, 0.35);
    }


    /* =========================
       系統訊息
       ========================= */

    .login-message {
        margin-bottom: 20px;

        padding: 10px 12px;

        border-radius: 6px;

        font-size: 14px;
    }

    .login-error {
        background-color: rgba(255, 42, 42, 0.12);

        border: 1px solid rgba(255, 42, 42, 0.4);

        color: #ff8c8c;
    }

    .login-success {
        background-color: rgba(76, 175, 80, 0.12);

        border: 1px solid rgba(76, 175, 80, 0.4);

        color: #8bd58e;
    }


    /* =========================
       註冊連結
       ========================= */

    .bottom-links {
        margin-top: 25px;

        text-align: center;

        color: #b1b5c8;

        font-size: 14px;
    }

    .bottom-links a {
        color: #ff2a2a;

        text-decoration: none;
    }

    .bottom-links a:hover {
        color: #ffffff;

        text-decoration: underline;
    }


    /* =========================
       手機版
       ========================= */

    @media (max-width: 480px) {

        .account-login-page {
            min-height: auto;
            padding: 10px 0;
        }

        .login-container {
            padding: 30px 22px;
        }

        .login-title h2 {
            font-size: 22px;
        }
    }

</style>

{% endblock %}


{% block content %}

<div class="account-login-page">

    <div class="login-container">

        <div class="login-title">
            <h2>會員登入</h2>
            <p>登入後即可使用會員功能</p>
        </div>


        {% if error %}
        <div class="login-message login-error">
            {{ error }}
        </div>
        {% endif %}


        {% if success %}
        <div class="login-message login-success">
            {{ success }}
        </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="login-form-group">

                <label for="username">
                    帳號
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="請輸入帳號"
                >

            </div>


            <div class="login-form-group">

                <label for="password">
                    密碼
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="請輸入密碼"
                >

            </div>


            <div class="forgot-password">

                <a href="{% url 'password-reset' %}">
                    忘記密碼？
                </a>

            </div>


            <button type="submit" class="login-button">
                登入
            </button>

        </form>


        <div class="bottom-links">

            還沒有帳號？

            <a href="{% url 'register' %}">
                立即註冊
            </a>

        </div>

    </div>

</div>

{% endblock %}
