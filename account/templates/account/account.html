{% extends "base.html" %}
{% load static %}

{% block title %}會員登入｜探劇實錄{% endblock %}


{% block extra_css %}
<link rel="stylesheet" href="{% static 'account/account.css' %}">
{% endblock %}


{% block content %}

<div class="account-login-page">

    <div class="login-container">

        <div class="login-title">
            <h2>會員登入</h2>
            <p>登入後即可使用會員功能</p>
        </div>


        {% if error %}
        <div class="login-message login-error">
            {{ error }}
        </div>
        {% endif %}


        {% if success %}
        <div class="login-message login-success">
            {{ success }}
        </div>
        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="login-form-group">

                <label for="username">
                    帳號
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="請輸入帳號"
                >

            </div>


            <div class="login-form-group">

                <label for="password">
                    密碼
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="請輸入密碼"
                >

            </div>


            <div class="forgot-password">

                <a href="{% url 'password-reset' %}">
                    忘記密碼？
                </a>

            </div>


            <button type="submit" class="login-button">
                登入
            </button>

        </form>


        <div class="bottom-links">

            還沒有帳號？

            <a href="{% url 'register' %}">
                立即註冊
            </a>

        </div>

    </div>

</div>

{% endblock %}
