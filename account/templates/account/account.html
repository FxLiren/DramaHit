<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入｜探劇實錄</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: #f5f3ef;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 420px;
            padding: 45px 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: 4px;
            color: #2f2f2f;
        }

        .logo p {
            margin: 10px 0 0;
            color: #888;
            font-size: 14px;
        }

        .login-title {
            margin-bottom: 25px;
        }

        .login-title h2 {
            margin: 0;
            font-size: 22px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d8d8d8;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #555;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;

            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #555;
        }

        .bottom-links {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
            color: #777;
        }

        .bottom-links a {
            color: #333;
            text-decoration: none;
        }

        .bottom-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                padding: 20px;
            }

            .login-container {
                width: 100%;
                padding: 35px 25px;
            }

            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>探劇實錄</h1>
            <p>劇本殺資訊與交流平台</p>
        </div>

        <div class="login-title">
            <h2>會員登入</h2>
        </div>

        <form>
            <div class="form-group">
                <label for="username">帳號</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="請輸入帳號"
                >
            </div>

            <div class="form-group">
                <label for="password">密碼</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="請輸入密碼"
                >
            </div>

            <button type="submit" class="login-button">
                登入
            </button>
        </form>

        <div class="bottom-links">
            還沒有帳號？
            <a href="#">立即註冊</a>
        </div>

    </div>

</body>
</html>
